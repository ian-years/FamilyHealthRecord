<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人健康档案工作台</title>
<link rel="stylesheet" href="styles.css?v=20260915-3">
</head>
<body>

<!-- ================= 登录 ================= -->
<div id="authScreen" class="auth-wrap hidden">
  <div class="auth-card">
    <h1>个人健康档案工作台</h1>
    <p class="sub">本工作台仅记录与展示你自己的医疗资料、用药与指标，不做诊断、不做治疗建议、不预测风险。</p>

    <div class="tabs" id="authTabs">
      <button data-at="pw" class="on">邮箱密码登录</button>
      <button data-at="otp">邮箱验证码</button>
      <button data-at="signup">注册</button>
      <button data-at="reset">找回密码</button>
    </div>

    <!-- 密码登录 -->
    <div id="at-pw">
      <div class="field"><label>邮箱 <span class="req">*</span></label>
        <input type="email" id="pwEmail" autocomplete="username" placeholder="you@example.com"></div>
      <div class="field"><label>密码 <span class="req">*</span></label>
        <input type="password" id="pwPass" autocomplete="current-password" placeholder="请输入密码"></div>
      <button class="btn primary" style="width:100%" id="btnPwLogin">登录</button>
    </div>

    <!-- 验证码登录 -->
    <div id="at-otp" class="hidden">
      <div class="field"><label>邮箱 <span class="req">*</span></label>
        <input type="email" id="otpEmail" autocomplete="username" placeholder="you@example.com"></div>
      <button class="btn" style="width:100%;margin-bottom:13px" id="btnOtpSend">发送验证码</button>
      <div class="field"><label>验证码 <span class="req">*</span></label>
        <input type="text" id="otpCode" inputmode="numeric" placeholder="邮件中的验证码"></div>
      <button class="btn primary" style="width:100%" id="btnOtpVerify">验证并登录</button>
    </div>

    <!-- 注册 -->
    <div id="at-signup" class="hidden">
      <div class="field"><label>邮箱 <span class="req">*</span></label>
        <input type="email" id="suEmail" autocomplete="username" placeholder="you@example.com"></div>
      <button class="btn" style="width:100%;margin-bottom:13px" id="btnSuSend">发送验证码</button>
      <div class="field"><label>验证码 <span class="req">*</span></label>
        <input type="text" id="suCode" inputmode="numeric" placeholder="邮件中的验证码"></div>
      <div class="field"><label>设置密码 <span class="req">*</span></label>
        <input type="password" id="suPass" autocomplete="new-password" placeholder="用于后续密码登录"></div>
      <button class="btn primary" style="width:100%" id="btnSuSubmit">完成注册</button>
      <div class="note">注册需先完成邮箱验证码校验，再把密码一并提交，这样密码登录才可用。</div>
    </div>

    <!-- 找回密码 -->
    <div id="at-reset" class="hidden">
      <div class="field"><label>邮箱 <span class="req">*</span></label>
        <input type="email" id="rsEmail" autocomplete="username" placeholder="you@example.com"></div>
      <button class="btn" style="width:100%;margin-bottom:13px" id="btnRsSend">发送验证码</button>
      <div class="field"><label>验证码 <span class="req">*</span></label>
        <input type="text" id="rsCode" inputmode="numeric"></div>
      <div class="field"><label>新密码 <span class="req">*</span></label>
        <input type="password" id="rsPass" autocomplete="new-password"></div>
      <button class="btn primary" style="width:100%" id="btnRsSubmit">重设密码</button>
    </div>

    <div id="authMsg" class="auth-msg hidden"></div>
  </div>
</div>

<!-- ================= 主应用 ================= -->
<div id="app" class="app hidden">
  <aside class="sidebar">
    <div class="brand">
      <h1>个人健康档案</h1>
      <p>Health Records Workbench</p>
    </div>
    <nav class="nav" id="nav">
      <button data-go="overview" class="active">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
        数据概览
      </button>
      <button data-go="timeline">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 4h12M2 8h12M2 12h8"/></svg>
        健康档案
      </button>
      <button data-go="upload">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 11V3M5 6l3-3 3 3M3 12v1.5h10V12"/></svg>
        上传资料
      </button>
      <button data-go="archive">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M2 3.5h12v3H2zM3 6.5h10V13H3z"/><path d="M7 9h2"/></svg>
        原始资料档案
      </button>
      <button data-go="drugs">
        <svg class="ico" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="5.5" width="12" height="7" rx="2"/><path d="M8 5.5v7"/></svg>
        药品管理
      </button>
    </nav>
    <div class="side-foot">
      <div class="who" id="whoami"></div>
      <button class="btn sm ghost" id="btnSignOut">退出登录</button>
    </div>
  </aside>

  <main class="main" id="main">
    <section class="screen on" id="s-overview"></section>
    <section class="screen" id="s-timeline"></section>
    <section class="screen" id="s-upload"></section>
    <section class="screen" id="s-archive"></section>
    <section class="screen" id="s-drugs"></section>
  </main>
</div>

<!-- ================= 详情：医疗文档 ================= -->
<div class="detail-layer" id="docLayer">
  <div class="detail-top">
    <div class="inner">
      <button class="bk" id="docBack">← <span id="docBackLabel">返回</span></button>
      <span class="ttl" id="docTitle"></span>
      <span class="tag" id="docTypeTag" style="margin-left:auto"></span>
    </div>
  </div>
  <div class="detail-body" id="docBody"></div>
</div>

<!-- ================= 详情：药品 ================= -->
<div class="detail-layer" id="drugLayer">
  <div class="detail-top">
    <div class="inner">
      <button class="bk" id="drugBack">← 返回药品管理</button>
      <span class="ttl" id="drugTitle"></span>
      <span class="tag" id="drugStatus" style="margin-left:auto"></span>
    </div>
  </div>
  <div class="detail-body" id="drugBody"></div>
</div>

<!-- ================= 详情：指标 ================= -->
<div class="detail-layer" id="indLayer">
  <div class="detail-top">
    <div class="inner">
      <button class="bk" id="indBack">← <span id="indBackLabel">返回数据概览</span></button>
      <span class="ttl" id="indTitle"></span>
      <button class="btn sm" id="indDailyEntry" style="margin-left:auto">录入日常结果</button>
    </div>
  </div>
  <div class="detail-body" id="indBody"></div>
</div>

<!-- ================= 详情：全部票据来源 ================= -->
<div class="detail-layer" id="rcLayer">
  <div class="detail-top">
    <div class="inner">
      <button class="bk" id="rcBack">← 返回数据概览</button>
      <span class="ttl">全部票据来源</span>
    </div>
  </div>
  <div class="detail-body" id="rcBody"></div>
</div>

<!-- ================= 遮罩与抽屉 ================= -->
<div class="mask" id="mask"></div>

<div class="drawer" id="drawer-follow">
  <div class="dh"><h3>添加关注指标</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db" id="followBody"></div>
  <div class="df"><button class="btn" data-close="1">取消</button></div>
</div>

<div class="drawer" id="drawer-custom">
  <div class="dh"><h3>新建自定义指标</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db">
    <div class="field"><label>指标名称 <span class="req">*</span></label><input type="text" id="cusName" placeholder="例如：餐后 2 小时血糖"></div>
    <div class="field"><label>所属分组</label><select id="cusGroup"></select></div>
    <div class="field"><label>记录类型 <span class="req">*</span></label>
      <select id="cusType"><option value="数值">数值</option><option value="双数值">双数值（如收缩压 / 舒张压）</option><option value="定性文字">定性文字</option></select>
      <div class="hint">复杂「指标组」类型未实现前不提供创建选项，避免暴露无效选项。</div></div>
    <div class="field"><label>默认单位</label><input type="text" id="cusUnit" placeholder="例如：mmol/L"><div class="hint">可留空；留空时展示为「未提供」。</div></div>
    <div class="field"><label>别名（逗号分隔）</label><input type="text" id="cusAlias" placeholder="例如：餐后血糖, PBG"><div class="hint">仅用于受控的项目名称匹配，不做过宽的子串匹配。</div></div>
    <div class="field"><label>立即关注</label><select id="cusFollow"><option value="yes">是</option><option value="no">否</option></select></div>
    <div class="note">新建指标只写入目录，<b>不生成任何结果</b>。</div>
  </div>
  <div class="df"><button class="btn" data-close="1">取消</button><button class="btn primary" id="btnCusSave">保存指标</button></div>
</div>

<div class="drawer" id="drawer-daily">
  <div class="dh"><h3>录入日常结果</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db" id="dailyBody"></div>
  <div class="df"><button class="btn" data-close="1">取消</button><button class="btn primary" id="btnDailySave">保存记录</button></div>
</div>

<div class="drawer" id="drawer-start">
  <div class="dh"><h3>开始用药</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db" id="startBody"></div>
  <div class="df"><button class="btn" data-close="1">取消</button><button class="btn primary" id="btnStartSave">确认并开始</button></div>
</div>

<div class="drawer" id="drawer-pause">
  <div class="dh"><h3>暂停用药</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db" id="pauseBody"></div>
  <div class="df"><button class="btn" data-close="1">取消</button><button class="btn primary" id="btnPauseSave">确认暂停</button></div>
</div>

<div class="drawer" id="drawer-stop">
  <div class="dh"><h3>停止用药</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db" id="stopBody"></div>
  <div class="df"><button class="btn" data-close="1">取消</button><button class="btn primary" id="btnStopSave">确认停止</button></div>
</div>

<div class="drawer" id="drawer-import">
  <div class="dh"><h3>归档已解析资料</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db" id="importBody"></div>
  <div class="df"><button class="btn" data-close="1">取消</button><button class="btn primary" id="btnImportSave">写入档案</button></div>
</div>

<div class="drawer" id="drawer-policy">
  <div class="dh"><h3>状态与有效期规则</h3><button class="btn ghost sm" data-close="1">关闭</button></div>
  <div class="db" id="policyBody"></div>
  <div class="df"><button class="btn" data-close="1">关闭</button></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<!-- 资源带版本参数：托管平台的 CDN 会长期缓存 JS/CSS，而 HTML 每次都取最新。
     改完代码必须同步递增下面的版本号，否则用户浏览器会继续执行旧脚本。 -->
<script src="config.js?v=20260915-3"></script>
<script src="logic.js?v=20260915-3"></script>
<script src="app.js?v=20260915-3"></script>
</body>
</html>
